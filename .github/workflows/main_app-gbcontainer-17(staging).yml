# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontainer-17

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crchy17.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_D3CCB173DFC14F5C82E20118D83EB546 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_EFD60B2130084DE7BEF2A1923E51F53D }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crchy17.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_D3CCB173DFC14F5C82E20118D83EB546 }}/guestbook-app:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontainer-17'
          slot-name: 'staging'
          images: 'crchy17.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_D3CCB173DFC14F5C82E20118D83EB546 }}/guestbook-app:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D4AF0F4E5D074A78B634C5560EDF13BE }}